# Конфигурация GestureLab PC. Правь здесь, а не в коде.
# CLI-флаги (--fps и др.) перебивают значения этого файла.

# Положения камеры, переключаются клавишей p
positions = ["грудь", "шнурок", "подставка"]

# Целевая частота записи кадров в JSON (эталон ТЗ — 15)
fps = 15.0

# Защита от бесконечной сессии и роста памяти: авто-стоп и сохранение
max_session_seconds = 600.0

# Пороги MediaPipe (крути для экспериментов; подбор — --calibrate --input)
min_detection_confidence = 0.5
min_tracking_confidence = 0.5
face_confidence = 0.5
